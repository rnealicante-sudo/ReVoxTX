<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReVoxTX - Radio en Vivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-zinc-900 rounded-3xl p-8">
    <h1 class="text-4xl font-bold text-center mb-2">ReVoxTX</h1>
    <p class="text-center text-red-400 mb-8">Radio en Vivo</p>

    <div class="mb-8">
      <p class="text-zinc-400 mb-3">Enlace de escucha (compártelo)</p>
      <input id="streamUrl" placeholder="http://tu-servidor.com:8000/stream" 
             class="w-full bg-zinc-800 p-4 rounded-2xl text-sm">
    </div>

    <button onclick="playStream()" 
            class="w-full h-16 bg-emerald-600 text-xl font-bold rounded-3xl mb-6">
      ▶️ ESCUCHAR EN VIVO
    </button>

    <audio id="player" controls class="w-full hidden"></audio>

    <div id="status" class="text-center text-sm mt-4"></div>
  </div>

  <script>
    function playStream() {
      const url = document.getElementById('streamUrl').value.trim();
      if (!url) return alert("Pega tu URL de Icecast");

      const audio = document.getElementById('player');
      audio.src = url;
      audio.classList.remove('hidden');
      audio.play();
      document.getElementById('status').innerHTML = '✅ Reproduciendo en vivo';
    }
  </script>
</body>
</html>
