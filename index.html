<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ReVoxTX</title>
  <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

<div class="max-w-md mx-auto bg-zinc-900 min-h-screen flex flex-col">
  <header class="bg-gradient-to-r from-red-700 to-red-600 px-6 py-6">
    <div class="flex justify-between items-center">
      <h1 class="text-4xl font-bold">ReVoxTX</h1>
      <div id="onAir" class="hidden px-6 py-2 bg-red-600 rounded-full font-bold animate-pulse">● ON AIR</div>
    </div>
  </header>

  <main class="flex-1 p-6 space-y-8">
    <div>
      <label class="block text-zinc-400 mb-2">🎤 Micrófono</label>
      <select id="micSelect" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4"></select>
    </div>

    <div>
      <label class="block text-zinc-400 mb-2">Nivel de Entrada</label>
      <div id="vuContainer" class="h-36 bg-zinc-950 border border-zinc-700 rounded-3xl p-4 flex items-end gap-1"></div>
    </div>

    <div id="status" class="text-center text-sm font-mono bg-zinc-800 p-4 rounded-2xl">Listo para transmitir</div>
  </main>

  <div class="p-6 border-t border-zinc-700">
    <button id="startBtn" class="w-full h-16 text-2xl font-bold bg-red-600 rounded-3xl active:bg-red-700">
      🎤 INICIAR TRANSMISIÓN
    </button>
  </div>

  <div id="linkContainer" class="hidden p-6 border-t border-zinc-700 bg-zinc-900">
    <p class="text-xs text-zinc-400 mb-2">ENLACE PARA RECEPTOR</p>
    <div id="link" class="bg-zinc-950 p-4 rounded-2xl border border-dashed border-zinc-600 text-emerald-400 break-all font-mono text-sm"></div>
  </div>
</div>

<script>
  let peer = null;
  let localStream = null;
  let isTransmitting = false;

  const config = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'stun:openrelay.metered.ca:80' }
    ]
  };

  async function startTransmission() {
    const btn = document.getElementById('startBtn');
    const status = document.getElementById('status');

    if (isTransmitting) {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peer) peer.destroy();
      btn.textContent = "🎤 INICIAR TRANSMISIÓN";
      document.getElementById('onAir').classList.add('hidden');
      document.getElementById('linkContainer').classList.add('hidden');
      isTransmitting = false;
      status.textContent = "Transmisión detenida";
      return;
    }

    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: { sampleRate: { ideal: 48000 }, echoCancellation: true, noiseSuppression: true, autoGainControl: false }
      });

      status.textContent = "Creando conexión...";

      peer = new SimplePeer({
        initiator: true,
        trickle: false,
        stream: localStream,
        config: config
      });

      peer.on('signal', data => {
        const link = `${window.location.origin}/receiver.html?signal=${encodeURIComponent(JSON.stringify(data))}`;
        document.getElementById('link').textContent = link;
        document.getElementById('linkContainer').classList.remove('hidden');
        btn.textContent = "● ON AIR";
        document.getElementById('onAir').classList.remove('hidden');
        status.textContent = "Transmisión activa - Comparte el enlace";
        isTransmitting = true;
      });

      peer.on('error', err => {
        status.textContent = "Error: " + err.message;
        console.error(err);
      });

    } catch (err) {
      status.textContent = "Error micrófono: " + err.message;
    }
  }

  document.getElementById('startBtn').addEventListener('click', startTransmission);
</script>
</body>
</html>
