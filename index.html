<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ReVoxTX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

<div class="max-w-md mx-auto bg-zinc-900 min-h-screen flex flex-col">
  <header class="bg-gradient-to-r from-red-700 to-red-600 px-6 py-6">
    <h1 class="text-4xl font-bold text-center">ReVoxTX</h1>
    <p class="text-red-100 text-center text-sm">Transmisor de voz profesional</p>
  </header>

  <main class="flex-1 p-6 space-y-8">
    <div class="text-center">
      <button onclick="startTransmission()" 
              id="startBtn"
              class="w-full h-16 text-2xl font-bold bg-red-600 rounded-3xl active:bg-red-700 transition-all">
        🎤 INICIAR TRANSMISIÓN
      </button>
    </div>

    <div id="linkContainer" class="hidden space-y-4">
      <p class="text-xs text-zinc-400">ENLACE PARA RECEPTOR</p>
      <div id="link" class="bg-zinc-950 p-5 rounded-2xl border border-dashed border-zinc-600 text-emerald-400 font-mono text-sm break-all"></div>
      
      <div class="grid grid-cols-4 gap-3">
        <button onclick="copyLink()" class="py-4 bg-zinc-800 rounded-2xl text-sm">📋</button>
        <button onclick="shareWhatsApp()" class="py-4 bg-green-600 rounded-2xl text-sm">WA</button>
        <button onclick="shareTelegram()" class="py-4 bg-blue-600 rounded-2xl text-sm">TG</button>
        <button onclick="shareEmail()" class="py-4 bg-zinc-800 rounded-2xl text-sm">✉️</button>
      </div>
    </div>
  </main>
</div>

<script>
  function startTransmission() {
    const roomId = "revox-" + Math.random().toString(36).substring(2, 10);
    
    // Configuración optimizada para voz de alta calidad
    const pushUrl = `https://vdo.ninja/?push=${roomId}&proaudio&stereo&audiobitrate=256&label=Reportero`;
    
    const viewUrl = `https://vdo.ninja/?view=${roomId}&proaudio&stereo&audiobitrate=256`;
    
    document.getElementById('link').innerHTML = `
      <a href="${viewUrl}" target="_blank" class="underline">${viewUrl}</a>
    `;
    document.getElementById('linkContainer').classList.remove('hidden');
    
    // Abrir el transmisor en nueva pestaña
    window.open(pushUrl, '_blank');
  }

  function copyLink() {
    const link = document.getElementById('link').querySelector('a').href;
    navigator.clipboard.writeText(link);
    alert('✅ Enlace copiado');
  }

  function shareWhatsApp() {
    const link = document.getElementById('link').querySelector('a').href;
    window.open(`https://wa.me/?text=${encodeURIComponent('🎙️ ReVoxTX - Transmisión en vivo: ' + link)}`);
  }

  function shareTelegram() {
    const link = document.getElementById('link').querySelector('a').href;
    window.open(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=🎙️ ReVoxTX en vivo`);
  }

  function shareEmail() {
    const link = document.getElementById('link').querySelector('a').href;
    window.location.href = `mailto:?subject=ReVoxTX - Enlace en vivo&body=${encodeURIComponent(link)}`;
  }
</script>
</body>
</html>
