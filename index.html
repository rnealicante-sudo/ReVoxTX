<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#b91c1c">
  <title>ReVoxTX</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .vu-bar { transition: height 0.07s linear; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <div class="max-w-md mx-auto bg-zinc-900 min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-gradient-to-r from-red-700 to-red-600 px-6 py-5">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-4xl font-bold tracking-tighter">ReVoxTX</h1>
          <p class="text-red-100 text-sm">Transmisor en vivo</p>
        </div>
        <div id="statusIndicator" class="hidden text-xs font-bold px-5 py-2 bg-red-600 rounded-full animate-pulse">
          ● ON AIR
        </div>
      </div>
    </header>

    <main class="flex-1 p-5 space-y-8 overflow-auto">

      <!-- Micrófono -->
      <div>
        <label class="text-zinc-400 text-sm block mb-2">🎤 MICRÓFONO</label>
        <select id="micSelect" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4 text-lg"></select>
      </div>

      <!-- VU Meter -->
      <div>
        <label class="text-zinc-400 text-sm block mb-2">NIVEL DE ENTRADA</label>
        <div id="vuContainer" class="h-36 bg-zinc-950 border-2 border-zinc-700 rounded-3xl p-4 flex items-end gap-1"></div>
        <div class="flex justify-between text-xs text-zinc-500 mt-2 px-1">
          <span>-42 dB</span>
          <span class="text-emerald-400 font-medium">0 dB</span>
          <span class="text-red-500">+12 dB</span>
        </div>
      </div>

      <!-- Ganancia -->
      <div>
        <div class="flex justify-between items-center mb-3">
          <span class="text-zinc-400">GANANCIA</span>
          <span id="gainValue" class="font-mono text-3xl text-emerald-400">+8 dB</span>
        </div>
        <input type="range" id="gainSlider" min="0" max="32" value="8" step="1" 
               class="w-full accent-red-600">
      </div>

      <!-- Efectos -->
      <div class="bg-zinc-950 border border-zinc-700 rounded-3xl p-6">
        <h3 class="text-red-400 text-sm mb-5">EFECTOS</h3>
        <div class="space-y-6">
          <label class="flex justify-between items-center">
            <span class="text-lg">Compresor</span>
            <input type="checkbox" id="compToggle" checked class="w-8 h-8 accent-red-600">
          </label>
          <label class="flex justify-between items-center">
            <span class="text-lg">Puerta de Ruido</span>
            <input type="checkbox" id="gateToggle" checked class="w-8 h-8 accent-red-600">
          </label>
          <label class="flex justify-between items-center">
            <span class="text-lg">Limitador</span>
            <input type="checkbox" id="limitToggle" checked class="w-8 h-8 accent-red-600">
          </label>
        </div>
      </div>
    </main>

    <!-- BOTÓN PRINCIPAL -->
    <div class="p-5 border-t border-zinc-700 mt-auto">
      <button id="startBtn"
              class="w-full h-16 text-2xl font-bold rounded-3xl bg-red-600 active:bg-red-700 transition-all shadow-xl">
        🎤 INICIAR TRANSMISIÓN
      </button>
    </div>

    <!-- Estado -->
    <div id="status" class="mx-5 mb-4 text-center text-sm font-mono bg-zinc-900 border border-zinc-700 rounded-2xl p-4 hidden"></div>

    <!-- Enlace y Compartir -->
    <div id="linkContainer" class="hidden border-t border-zinc-700 bg-zinc-900 p-5">
      <p class="text-xs text-zinc-400 mb-3">ENLACE PARA RECEPTOR</p>
      <div id="link" class="bg-zinc-950 p-4 rounded-2xl border border-dashed border-zinc-600 text-emerald-400 break-all text-sm font-mono"></div>
      
      <div class="grid grid-cols-4 gap-3 mt-6">
        <button onclick="copyLink()" class="py-4 bg-zinc-800 hover:bg-zinc-700 rounded-2xl text-sm">📋</button>
        <button onclick="shareWhatsApp()" class="py-4 bg-green-600 hover:bg-green-700 rounded-2xl text-sm">WA</button>
        <button onclick="shareTelegram()" class="py-4 bg-blue-600 hover:bg-blue-700 rounded-2xl text-sm">TG</button>
        <button onclick="shareEmail()" class="py-4 bg-zinc-800 hover:bg-zinc-700 rounded-2xl text-sm">✉️</button>
      </div>
    </div>
  </div>

  <script>
    let peer, localStream, audioContext, source, gainNode, analyser, dataArray, leds = [];
    let isTransmitting = false;

    function createVUMeter() {
      const container = document.getElementById('vuContainer');
      container.innerHTML = '';
      leds = [];
      for (let i = 0; i < 32; i++) {
        const led = document.createElement('div');
        led.className = `vu-bar flex-1 bg-zinc-700 rounded`;
        container.appendChild(led);
        leds.push(led);
      }
    }

    function updateVU() {
      if (!analyser) return;
      analyser.getByteFrequencyData(dataArray);
      const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
      const level = Math.min(1, avg / 170);

      leds.forEach((led, i) => {
        const pos = i / 32;
        led.style.height = (pos < level ? 88 : 10) + "%";
        led.style.backgroundColor = pos > 0.78 ? '#ef4444' : pos > 0.58 ? '#eab308' : '#22c55e';
      });
    }

    function applyEffects() {
      if (!source) return;
      source.disconnect();
      let node = source;

      if (document.getElementById('gateToggle').checked) {
        const gate = audioContext.createGain(); gate.gain.value = 1;
        node.connect(gate); node = gate;
      }
      if (document.getElementById('compToggle').checked) {
        const comp = audioContext.createDynamicsCompressor();
        comp.threshold.value = -24; comp.ratio.value = 4;
        node.connect(comp); node = comp;
      }
      if (document.getElementById('limitToggle').checked) {
        const lim = audioContext.createDynamicsCompressor();
        lim.threshold.value = -6; lim.ratio.value = 20;
        node.connect(lim); node = lim;
      }
      node.connect(gainNode);
      gainNode.connect(analyser);
    }

    async function toggleTransmission() {
      const btn = document.getElementById('startBtn');
      const statusEl = document.getElementById('status');
      const indicator = document.getElementById('statusIndicator');

      if (isTransmitting) {
        localStream?.getTracks().forEach(t => t.stop());
        peer?.destroy();
        audioContext?.close();
        btn.textContent = "🎤 INICIAR TRANSMISIÓN";
        indicator.classList.add('hidden');
        document.getElementById('linkContainer').classList.add('hidden');
        isTransmitting = false;
        return;
      }

      try {
        const micId = document.getElementById('micSelect').value;
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            deviceId: micId ? { exact: micId } : undefined,
            sampleRate: { ideal: 48000 },
            echoCancellation: true,
            noiseSuppression: true
          }
        });

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        source = audioContext.createMediaStreamSource(localStream);
        gainNode = audioContext.createGain();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 128;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        gainNode.gain.value = 1.8;
        applyEffects();
        createVUMeter();
        setInterval(updateVU, 50);

        peer = new Peer();
        peer.on('open', (id) => {
          const link = `${window.location.origin}/receiver.html?id=${id}`;
          document.getElementById('link').textContent = link;
          document.getElementById('linkContainer').classList.remove('hidden');
          
          btn.textContent = "● ON AIR";
          indicator.classList.remove('hidden');
          statusEl.textContent = `Transmisión activa - ID: ${id}`;
          statusEl.classList.remove('hidden');
        });

        peer.on('call', call => call.answer(localStream));
        isTransmitting = true;
      } catch (err) {
        statusEl.textContent = "❌ " + err.message;
        statusEl.classList.remove('hidden');
      }
    }

    // Eventos
    document.getElementById('gainSlider').addEventListener('input', e => {
      if (gainNode) gainNode.gain.value = Math.pow(10, e.target.value / 20);
      document.getElementById('gainValue').textContent = `+${e.target.value} dB`;
    });

    document.querySelectorAll('#compToggle, #gateToggle, #limitToggle').forEach(el => {
      el.addEventListener('change', () => { if (isTransmitting) applyEffects(); });
    });

    function copyLink() { navigator.clipboard.writeText(document.getElementById('link').textContent); alert('Enlace copiado'); }
    function shareWhatsApp() { const l = document.getElementById('link').textContent; window.open(`https://wa.me/?text=${encodeURIComponent('🎙️ ReVoxTX: ' + l)}`); }
    function shareTelegram() { const l = document.getElementById('link').textContent; window.open(`https://t.me/share/url?url=${encodeURIComponent(l)}`); }
    function shareEmail() { const l = document.getElementById('link').textContent; window.location.href = `mailto:?subject=ReVoxTX&body=${encodeURIComponent(l)}`; }

    async function loadMics() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const select = document.getElementById('micSelect');
      select.innerHTML = '';
      devices.filter(d => d.kind === 'audioinput').forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label ? d.label.replace(/\s*\(.*?\)/, '') : 'Micrófono';
        select.appendChild(opt);
      });
    }

    // Inicializar
    document.getElementById('startBtn').addEventListener('click', toggleTransmission);
    navigator.mediaDevices.addEventListener('devicechange', loadMics);
    loadMics();
  </script>
</body>
</html>
