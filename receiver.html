<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ReVoxRX</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full">
    <h1 class="text-5xl font-bold text-center mb-2">ReVoxRX</h1>
    <p class="text-center text-zinc-400 mb-8">Receptor en vivo</p>

    <input id="peerId" placeholder="Pega el ID del transmisor" 
           class="w-full bg-zinc-800 border border-zinc-700 rounded-3xl p-5 text-center text-lg mb-6">

    <button id="connectBtn" class="w-full h-14 text-xl font-semibold bg-emerald-600 rounded-3xl">
      🔊 CONECTAR Y ESCUCHAR
    </button>

    <audio id="remoteAudio" autoplay controls class="w-full mt-8 hidden"></audio>

    <div id="status" class="mt-6 text-center font-mono text-sm"></div>
  </div>

  <script>
    let peer = null;

    document.getElementById('connectBtn').addEventListener('click', () => {
      const peerId = document.getElementById('peerId').value.trim();
      if (!peerId) return alert("Pega el ID del transmisor");

      const status = document.getElementById('status');
      status.textContent = "Iniciando conexión...";

      // Cerrar conexión anterior si existe
      if (peer) peer.destroy();

      peer = new Peer();

      peer.on('open', () => {
        status.textContent = "Llamando al transmisor...";
        const call = peer.call(peerId);
        
        call.on('stream', (stream) => {
          const audio = document.getElementById('remoteAudio');
          audio.srcObject = stream;
          audio.classList.remove('hidden');
          audio.play().catch(() => {});
          status.innerHTML = '✅ <span class="text-emerald-400">ESCUCHANDO EN VIVO</span>';
        });

        call.on('error', (err) => status.textContent = "Error en llamada: " + err);
      });

      peer.on('error', (err) => {
        status.textContent = "Error PeerJS: " + err.type;
        console.error(err);
      });
    });

    // Auto-cargar ID desde URL
    const params = new URLSearchParams(window.location.search);
    if (params.get('id')) {
      document.getElementById('peerId').value = params.get('id');
    }
  </script>
</body>
</html>
