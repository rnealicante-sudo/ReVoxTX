<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReVoxRX - Receptor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full">
    <h1 class="text-4xl font-bold text-center mb-8">ReVoxRX</h1>
    <p class="text-center text-zinc-400 mb-8">Pega el enlace que te enviaron</p>
    
    <input id="urlInput" placeholder="Pega aquí el enlace completo" class="w-full bg-zinc-800 border border-zinc-700 rounded-3xl p-5 mb-6">
    
    <button onclick="openReceiver()" 
            class="w-full h-14 text-xl font-semibold bg-emerald-600 rounded-3xl">
      🔊 ABRIR RECEPTOR
    </button>
  </div>

  <script>
    function openReceiver() {
      let url = document.getElementById('urlInput').value.trim();
      if (url) window.open(url, '_blank');
    }
  </script>
</body>
</html>
